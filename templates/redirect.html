<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Ativando Acesso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f1923; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:'Segoe UI',sans-serif; }
    .box { background:#1c2733; border:1px solid #2a3a4a; border-radius:16px; max-width:400px; width:90%; padding:36px 32px; text-align:center; }
    .tg-circle { width:70px;height:70px;border-radius:50%;background:#2AABEE;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2rem;color:#fff; }
    h5 { color:#e8f0f8; font-weight:700; margin-bottom:8px; }
    p { color:#a8bfd0; font-size:.9rem; margin-bottom:24px; }
    .btn-tg { display:block;background:#2AABEE;color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:1rem;text-decoration:none;transition:background .15s; }
    .btn-tg:hover { background:#1a94d6;color:#fff; }
    small { color:#7d9ab5;font-size:.78rem; }
  </style>
</head>
<body>
<div class="box">
  <div class="tg-circle"><i class="bi bi-telegram"></i></div>
  <h5>Acesso Pronto!</h5>
  <p>
    Clique abaixo para ativar sua assinatura de
    {% if days == 0 %}<strong>acesso vitalicio</strong>{% else %}<strong>{{ days }} dias</strong>{% endif %}.
  </p>
  <a href="{{ telegram_url }}" class="btn-tg mb-3">
    <i class="bi bi-telegram me-2"></i>Abrir no Telegram
  </a>
  <br><small>O bot enviara o link do grupo automaticamente.</small>
</div>
</body>
</html>
