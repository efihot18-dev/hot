{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:85vh">
  <div class="card p-4" style="width:360px">
    <div class="text-center mb-4">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--tg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.7rem;color:#fff">
        <i class="bi bi-telegram"></i>
      </div>
      <h5 class="fw-bold text-white mb-1">SubManager</h5>
      <small style="color:var(--muted)">Gerenciador de Assinaturas Telegram</small>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-tg w-100 py-2 fw-bold">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
